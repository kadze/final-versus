name: 'Deploy Versus'

on:
  push:
    branches:
      - feature/**
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT_STAGE: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXISTS=$(aws ecr batch-get-image --repository-name versus-ubuntu-backend --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'images' --output json 2>/dev/null)
          if [ "$EXISTS" != "[]" ] && [ -n "$EXISTS" ]; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build"
          else
            docker build -t $REGISTRY/versus-ubuntu-backend:$IMAGE_TAG backend/
            docker push $REGISTRY/versus-ubuntu-backend:$IMAGE_TAG
          fi

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXISTS=$(aws ecr batch-get-image --repository-name versus-ubuntu-frontend --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'images' --output json 2>/dev/null)
          if [ "$EXISTS" != "[]" ] && [ -n "$EXISTS" ]; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build"
          else
            docker build -t $REGISTRY/versus-ubuntu-frontend:$IMAGE_TAG frontend/
            docker push $REGISTRY/versus-ubuntu-frontend:$IMAGE_TAG
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name eks-kadze-${ENVIRONMENT_STAGE} --region $AWS_REGION

      - name: Create versus namespace
        run: kubectl create namespace versus --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy versus-backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install versus-backend helm/versus-backend \
            --namespace versus \
            --values helm/versus-backend/values-dev.yaml \
            --set image.tag=$IMAGE_TAG \
            --wait

      - name: Deploy versus-frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install versus-frontend helm/versus-frontend \
            --namespace versus \
            --values helm/versus-frontend/values-dev.yaml \
            --set image.tag=$IMAGE_TAG \
            --wait
