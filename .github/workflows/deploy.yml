name: 'Build and Push Versus'

# Renamed from "Deploy Versus" — this workflow no longer deploys anything.
# It builds images, pushes to ECR, and commits the new tag back to the
# values files. ArgoCD (tracking this repo from kadze-gitops) does the
# actual deploy by reconciling that commit. No EKS/kubectl/helm access
# needed here at all now — ECR push is the only AWS permission this
# workflow uses.

on:
  push:
    branches:
      - feature/**
      - main
    # Without this, the tag-bump commit below would itself trigger a new
    # run — [skip ci] in the commit message already prevents that, but
    # excluding the values files here too means an unrelated values-dev.yaml
    # edit (e.g. changing replicaCount) doesn't rebuild images for no reason.
    paths-ignore:
      - 'helm/**/values-dev.yaml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT_STAGE: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: GitHubActionsRoleSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXISTS=$(aws ecr batch-get-image --repository-name versus-ubuntu-backend --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'images' --output json 2>/dev/null)
          if [ "$EXISTS" != "[]" ] && [ -n "$EXISTS" ]; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build"
          else
            docker build -t $REGISTRY/versus-ubuntu-backend:$IMAGE_TAG backend/
            docker push $REGISTRY/versus-ubuntu-backend:$IMAGE_TAG
          fi

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXISTS=$(aws ecr batch-get-image --repository-name versus-ubuntu-frontend --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query 'images' --output json 2>/dev/null)
          if [ "$EXISTS" != "[]" ] && [ -n "$EXISTS" ]; then
            echo "Image $IMAGE_TAG already exists in ECR, skipping build"
          else
            docker build -t $REGISTRY/versus-ubuntu-frontend:$IMAGE_TAG frontend/
            docker push $REGISTRY/versus-ubuntu-frontend:$IMAGE_TAG
          fi

      - name: Bump image tag in values-dev.yaml and commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for f in helm/versus-backend/values-dev.yaml helm/versus-frontend/values-dev.yaml; do
            if grep -q '^  tag:' "$f"; then
              sed -i "s|^  tag:.*|  tag: \"$IMAGE_TAG\"|" "$f"
            else
              sed -i "/^  repository:/a\\  tag: \"$IMAGE_TAG\"" "$f"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/versus-backend/values-dev.yaml helm/versus-frontend/values-dev.yaml

          if git diff --cached --quiet; then
            echo "Tag unchanged, nothing to commit"
          else
            git commit -m "chore: bump dev image tag to ${IMAGE_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
