apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-db
  namespace: {{ .Release.Namespace }}
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "versus/db-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: MYSQL_DATABASE
            objectAlias: MYSQL_DATABASE
          - path: MYSQL_USER
            objectAlias: MYSQL_USER
          - path: MYSQL_PASSWORD
            objectAlias: MYSQL_PASSWORD
          - path: MYSQL_HOST
            objectAlias: MYSQL_HOST
          - path: MYSQL_PORT
            objectAlias: MYSQL_PORT
          - path: DJANGO_SECRET_KEY
            objectAlias: DJANGO_SECRET_KEY
  secretObjects:
    - secretName: {{ .Values.dbSecret.name }}
      type: Opaque
      data:
        - objectName: MYSQL_DATABASE
          key: MYSQL_DATABASE
        - objectName: MYSQL_USER
          key: MYSQL_USER
        - objectName: MYSQL_PASSWORD
          key: MYSQL_PASSWORD
        - objectName: MYSQL_HOST
          key: MYSQL_HOST
        - objectName: MYSQL_PORT
          key: MYSQL_PORT
        - objectName: DJANGO_SECRET_KEY
          key: DJANGO_SECRET_KEY
